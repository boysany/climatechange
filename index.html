    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#090c13';
            document.documentElement.style.color = '#f3f5f9';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#f6f5f2';
            document.documentElement.style.color = '#0d1017';
          }
        } catch (e) {}

        var isExtError = function (msg) {
          if (!msg) return false;
          var str =
            typeof msg === 'string'
              ? msg
              : msg.message || msg.stack || (typeof msg.toString === 'function' ? msg.toString() : String(msg));
          return (
            str.indexOf('MetaMask') !== -1 ||
            str.indexOf('ethereum') !== -1 ||
            str.indexOf('chrome-extension') !== -1 ||
            str.indexOf('Failed to connect to MetaMask') !== -1 ||
            str.indexOf('wallet') !== -1
          );
        };

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            if (isExtError(event.reason)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );

        window.addEventListener(
          'error',
          function (event) {
            if (isExtError(event.message) || isExtError(event.error)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );

        var origConsoleError = console.error;
        console.error = function () {
          for (var i = 0; i < arguments.length; i++) {
            if (isExtError(arguments[i])) {
              return;
            }
          }
          origConsoleError.apply(console, arguments);
        };
      })();
    </script>
